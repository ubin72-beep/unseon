<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>로그인 진단 — 운세ON</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Apple SD Gothic Neo', sans-serif; background: #f0f2f5; padding: 20px; }
  h1 { font-size: 1.3rem; color: #1a1a2e; margin-bottom: 20px; }
  .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .card h2 { font-size: 1rem; font-weight: 700; margin-bottom: 14px; color: #333; }
  input { width: 100%; padding: 10px 12px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 0.95rem; margin-bottom: 8px; }
  button { padding: 10px 20px; background: #1b5e20; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 600; margin-right: 8px; margin-bottom: 8px; }
  button.red { background: #c62828; }
  button.blue { background: #1565c0; }
  button.orange { background: #e65100; }
  .log { background: #f8f9fa; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 0.82rem; line-height: 1.8; max-height: 300px; overflow-y: auto; margin-top: 10px; }
  .ok  { color: #2e7d32; font-weight: 700; }
  .err { color: #c62828; font-weight: 700; }
  .warn{ color: #e65100; font-weight: 700; }
  .info{ color: #1565c0; }
  .result-box { padding: 14px 18px; border-radius: 8px; font-size: 0.9rem; margin-top: 10px; }
  .result-box.pass { background: #e8f5e9; border: 1.5px solid #4caf50; color: #1b5e20; }
  .result-box.fail { background: #ffebee; border: 1.5px solid #ef5350; color: #c62828; }
  .result-box.warn { background: #fff8e1; border: 1.5px solid #ffc107; color: #e65100; }
  label { font-size: 0.88rem; color: #555; font-weight: 600; display: block; margin-bottom: 4px; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; }
  hr { border: none; border-top: 1px solid #eee; margin: 12px 0; }
</style>
</head>
<body>
<h1>🔍 로그인 오류 진단 도구 — 운세ON</h1>

<!-- 1. DB 이메일 검색 테스트 -->
<div class="card">
  <h2>① DB 이메일 검색 테스트</h2>
  <label>검색할 이메일</label>
  <div class="row">
    <input type="email" id="searchEmail" placeholder="가입한 이메일 주소 입력" />
    <button onclick="testSearch()">🔍 검색</button>
  </div>
  <div class="log" id="searchLog">여기에 결과가 표시됩니다...</div>
</div>

<!-- 2. 비밀번호 해시 확인 -->
<div class="card">
  <h2>② 비밀번호 해시 확인</h2>
  <label>비밀번호</label>
  <div class="row">
    <input type="text" id="hashInput" placeholder="비밀번호 입력" />
    <button onclick="testHash()" class="blue">🔑 해시 계산</button>
  </div>
  <div class="log" id="hashLog">여기에 결과가 표시됩니다...</div>
</div>

<!-- 3. 전체 로그인 흐름 시뮬레이션 -->
<div class="card">
  <h2>③ 로그인 흐름 전체 시뮬레이션</h2>
  <label>이메일</label>
  <input type="email" id="simEmail" placeholder="이메일" />
  <label>비밀번호</label>
  <input type="password" id="simPw" placeholder="비밀번호" />
  <button onclick="simulateLogin()">▶ 로그인 시뮬레이션</button>
  <div class="log" id="simLog">여기에 결과가 표시됩니다...</div>
</div>

<!-- 4. 전체 사용자 목록 조회 -->
<div class="card">
  <h2>④ DB 전체 사용자 목록 (최근 20명)</h2>
  <button onclick="listAllUsers()">📋 목록 조회</button>
  <button onclick="listAllUsers(50)" class="blue">📋 50명 조회</button>
  <div class="log" id="usersLog">여기에 결과가 표시됩니다...</div>
</div>

<!-- 5. 회원가입 후 즉시 로그인 테스트 -->
<div class="card">
  <h2>⑤ 회원가입 → 로그인 연속 흐름 테스트</h2>
  <p style="font-size:0.85rem;color:#666;margin-bottom:10px">임시 테스트 계정을 생성하고 바로 로그인을 시도합니다</p>
  <button onclick="testRegisterThenLogin()">🧪 가입→로그인 자동 테스트</button>
  <button onclick="cleanupTestAccount()" class="red">🗑️ 임시 계정 삭제</button>
  <div class="log" id="flowLog">여기에 결과가 표시됩니다...</div>
</div>

<!-- 6. localStorage 세션 상태 -->
<div class="card">
  <h2>⑥ 현재 로그인 세션 상태</h2>
  <button onclick="checkSession()">🔎 세션 확인</button>
  <button onclick="clearSession()" class="red">🗑️ 세션 초기화</button>
  <div class="log" id="sessionLog">여기에 결과가 표시됩니다...</div>
</div>

<script src="js/auth.js?v=20260620"></script>
<script>
/* ── 공통 로그 함수 ── */
function log(el, msg, type = 'info') {
  const div = document.getElementById(el);
  if (!div) return;
  const span = document.createElement('span');
  span.className = type;
  span.textContent = msg;
  const br = document.createElement('br');
  if (div.textContent === '여기에 결과가 표시됩니다...') div.innerHTML = '';
  div.appendChild(span);
  div.appendChild(br);
  div.scrollTop = div.scrollHeight;
}
function logClear(el) {
  const div = document.getElementById(el);
  if (div) div.innerHTML = '';
}

/* ── 해시 함수 (auth.js와 동일) ── */
function _hashPw(pw) {
  let hash = 0;
  for (let i = 0; i < pw.length; i++) {
    const c = pw.charCodeAt(i);
    hash = ((hash << 5) - hash) + c;
    hash = hash & hash;
  }
  return 'h_' + Math.abs(hash).toString(36) + '_' + pw.length;
}

/* ── ① DB 이메일 검색 ── */
async function testSearch() {
  logClear('searchLog');
  const email = document.getElementById('searchEmail').value.trim();
  if (!email) { log('searchLog', '❌ 이메일을 입력해주세요', 'err'); return; }

  log('searchLog', `🔍 검색 중: ${email}`, 'info');

  try {
    // 방법 1: search 파라미터
    const r1 = await fetch(`tables/users?search=${encodeURIComponent(email)}&limit=20`);
    const d1 = await r1.json();
    log('searchLog', `📦 search 파라미터 결과: 총 ${d1.total}건, rows: ${(d1.data||[]).length}개`, 'info');

    const exact = (d1.data||[]).filter(u => u.email === email);
    if (exact.length > 0) {
      log('searchLog', `✅ 정확 매칭: ${exact.length}명 발견`, 'ok');
      exact.forEach(u => {
        log('searchLog', `  → id: ${u.id}`, 'ok');
        log('searchLog', `  → name: ${u.name}`, 'ok');
        log('searchLog', `  → pw_hash: ${u.pw_hash}`, 'ok');
        log('searchLog', `  → status: ${u.status}`, 'ok');
        log('searchLog', `  → points: ${u.points}`, 'ok');
      });
    } else {
      log('searchLog', `⚠️ search로 찾음: ${(d1.data||[]).length}명 / 하지만 email 정확 매칭: 0명`, 'warn');
      if ((d1.data||[]).length > 0) {
        log('searchLog', '반환된 행들:', 'warn');
        (d1.data||[]).slice(0,5).forEach(u => {
          log('searchLog', `  → ${u.email} (id: ${u.id})`, 'warn');
        });
      }
    }

    // 방법 2: 전체 조회 후 클라이언트 필터
    log('searchLog', '──────────────────────', 'info');
    log('searchLog', '🔍 전체 조회 후 클라이언트 필터 방법...', 'info');
    const r2 = await fetch('tables/users?limit=200');
    const d2 = await r2.json();
    log('searchLog', `📦 전체 조회: 총 ${d2.total}건`, 'info');
    const found2 = (d2.data||[]).filter(u => u.email === email);
    if (found2.length > 0) {
      log('searchLog', `✅ 전체 조회에서 발견: ${found2.length}명`, 'ok');
      found2.forEach(u => log('searchLog', `  → ${u.name} (${u.id}) pw: ${u.pw_hash}`, 'ok'));
    } else {
      log('searchLog', `❌ 전체 조회에서도 미발견 → 이 이메일로 가입된 계정이 DB에 없음`, 'err');
      log('searchLog', `💡 해결: 다시 회원가입 시도 필요`, 'warn');
    }

  } catch(e) {
    log('searchLog', `❌ 오류: ${e.message}`, 'err');
  }
}

/* ── ② 해시 확인 ── */
function testHash() {
  logClear('hashLog');
  const pw = document.getElementById('hashInput').value;
  if (!pw) { log('hashLog', '❌ 비밀번호를 입력해주세요', 'err'); return; }
  const myHash = _hashPw(pw);
  const authHash = typeof hashPw === 'function' ? hashPw(pw) : '(hashPw 함수 없음)';
  log('hashLog', `입력 비밀번호: ${pw}`, 'info');
  log('hashLog', `진단도구 해시: ${myHash}`, 'info');
  log('hashLog', `auth.js 해시: ${authHash}`, 'info');
  if (myHash === authHash) {
    log('hashLog', `✅ 두 해시 일치 — 해시 함수 정상`, 'ok');
  } else {
    log('hashLog', `❌ 해시 불일치! auth.js 버전 문제 가능성`, 'err');
  }
}

/* ── ③ 로그인 시뮬레이션 ── */
async function simulateLogin() {
  logClear('simLog');
  const email = document.getElementById('simEmail').value.trim();
  const pw    = document.getElementById('simPw').value;
  if (!email || !pw) { log('simLog', '❌ 이메일과 비밀번호를 입력해주세요', 'err'); return; }

  log('simLog', `▶ 로그인 시뮬레이션: ${email}`, 'info');

  const inputHash = _hashPw(pw);
  log('simLog', `🔑 입력 비밀번호 해시: ${inputHash}`, 'info');

  try {
    // Step 1: DB 검색
    log('simLog', '── Step1: DB에서 이메일 검색...', 'info');
    const r = await fetch(`tables/users?search=${encodeURIComponent(email)}&limit=20`);
    const d = await r.json();
    const rows = d.data || [];
    const user = rows.find(u => u.email === email);

    if (!user) {
      // 전체 조회로 재시도
      log('simLog', '⚠️ search로 미발견 → 전체 조회 재시도...', 'warn');
      const r2 = await fetch('tables/users?limit=200');
      const d2 = await r2.json();
      const user2 = (d2.data||[]).find(u => u.email === email);
      if (!user2) {
        log('simLog', '❌ DB에 해당 이메일 계정 없음!', 'err');
        log('simLog', `💡 해결방법: 다시 회원가입 하거나, DB에 계정이 있는지 확인`, 'warn');
        return;
      } else {
        log('simLog', `✅ 전체 조회로 발견: ${user2.name}`, 'ok');
        checkUserLogin(user2, pw, inputHash);
        return;
      }
    }

    log('simLog', `✅ 사용자 발견: ${user.name} (id: ${user.id})`, 'ok');
    checkUserLogin(user, pw, inputHash);

  } catch(e) {
    log('simLog', `❌ 오류: ${e.message}`, 'err');
  }
}

function checkUserLogin(user, pw, inputHash) {
  log('simLog', `── Step2: 비밀번호 검증...`, 'info');
  log('simLog', `  DB pw_hash: ${user.pw_hash}`, 'info');
  log('simLog', `  입력 해시: ${inputHash}`, 'info');

  if (user.pw_hash === inputHash) {
    log('simLog', `✅ 비밀번호 일치!`, 'ok');
    log('simLog', `── Step3: 계정 상태 확인...`, 'info');
    if (user.status === 'suspended') {
      log('simLog', `❌ 정지된 계정`, 'err');
    } else {
      log('simLog', `✅ 상태 정상: ${user.status}`, 'ok');
      log('simLog', `🎉 로그인 성공 가능! 포인트: ${user.points}P`, 'ok');
    }
  } else {
    log('simLog', `❌ 비밀번호 불일치!`, 'err');
    log('simLog', `💡 가능한 원인:`, 'warn');
    log('simLog', `  1. 가입 시 입력한 비밀번호와 다름`, 'warn');
    log('simLog', `  2. 가입할 때 다른 비밀번호를 사용함`, 'warn');
    log('simLog', `  3. DB의 해시값이 잘못 저장됨`, 'warn');
  }
}

/* ── ④ 전체 사용자 목록 ── */
async function listAllUsers(limit = 20) {
  logClear('usersLog');
  log('usersLog', `📋 최근 ${limit}명 조회 중...`, 'info');
  try {
    const r = await fetch(`tables/users?limit=${limit}&sort=created_at`);
    const d = await r.json();
    log('usersLog', `총 ${d.total}명 가입`, 'ok');
    log('usersLog', '──────────────────────────────', 'info');
    (d.data||[]).forEach((u, i) => {
      log('usersLog', `${i+1}. ${u.name} | ${u.email}`, 'info');
      log('usersLog', `   pw_hash: ${u.pw_hash} | status: ${u.status} | points: ${u.points}P`, 'info');
      log('usersLog', `   id: ${u.id}`, 'info');
      log('usersLog', '──────────────────', 'info');
    });
  } catch(e) {
    log('usersLog', `❌ 오류: ${e.message}`, 'err');
  }
}

/* ── ⑤ 가입→로그인 자동 테스트 ── */
let _testAccountId = null;
async function testRegisterThenLogin() {
  logClear('flowLog');
  const ts = Date.now();
  const testEmail = `debug_test_${ts}@unseon.co.kr`;
  const testPw    = 'Test1234!';
  const testName  = '진단테스트';

  log('flowLog', `🧪 테스트 계정 이메일: ${testEmail}`, 'info');
  log('flowLog', `🧪 테스트 비밀번호: ${testPw}`, 'info');

  // Step 1: 가입
  log('flowLog', '── Step1: 회원가입 API 호출...', 'info');
  try {
    const newUser = {
      id:      'debug-test-' + ts,
      name:    testName,
      email:   testEmail,
      pw_hash: _hashPw(testPw),
      points:  500,
      status:  'active',
      social_provider: '',
      social_id: ''
    };
    const r = await fetch('tables/users', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(newUser)
    });
    if (!r.ok) {
      log('flowLog', `❌ 가입 API 실패: ${r.status}`, 'err');
      return;
    }
    const saved = await r.json();
    _testAccountId = saved.id;
    log('flowLog', `✅ 가입 성공! 저장 id: ${saved.id}`, 'ok');
    log('flowLog', `   저장된 pw_hash: ${saved.pw_hash}`, 'ok');
  } catch(e) {
    log('flowLog', `❌ 가입 오류: ${e.message}`, 'err');
    return;
  }

  // Step 2: 즉시 로그인 검색
  await new Promise(r => setTimeout(r, 500)); // 0.5초 대기
  log('flowLog', '── Step2: 즉시 로그인 검색 (0.5초 후)...', 'info');
  try {
    const r = await fetch(`tables/users?search=${encodeURIComponent(testEmail)}&limit=10`);
    const d = await r.json();
    const user = (d.data||[]).find(u => u.email === testEmail);
    if (user) {
      log('flowLog', `✅ search로 즉시 발견 가능!`, 'ok');
      const hashMatch = user.pw_hash === _hashPw(testPw);
      log('flowLog', `   해시 일치: ${hashMatch ? '✅ YES' : '❌ NO'}`, hashMatch ? 'ok' : 'err');
    } else {
      log('flowLog', `⚠️ search로 즉시 미발견 → 딜레이 문제 가능성`, 'warn');

      // 전체 조회로 재확인
      const r2 = await fetch(`tables/users?limit=200`);
      const d2 = await r2.json();
      const user2 = (d2.data||[]).find(u => u.email === testEmail);
      if (user2) {
        log('flowLog', `✅ 전체 조회로는 발견됨 → search API 딜레이 문제`, 'warn');
        log('flowLog', `💡 해결: findUserByEmail에서 전체 조회 fallback 추가 필요`, 'warn');
      } else {
        log('flowLog', `❌ 전체 조회에서도 미발견 → DB 저장 자체 실패`, 'err');
      }
    }
  } catch(e) {
    log('flowLog', `❌ 검색 오류: ${e.message}`, 'err');
  }

  log('flowLog', '──────────────────────────────', 'info');
  log('flowLog', '테스트 완료! "임시 계정 삭제" 버튼으로 정리하세요.', 'warn');
}

async function cleanupTestAccount() {
  logClear('flowLog');
  if (!_testAccountId) {
    log('flowLog', '⚠️ 삭제할 테스트 계정 ID 없음 (먼저 테스트를 실행하세요)', 'warn');
    return;
  }
  try {
    const r = await fetch(`tables/users/${_testAccountId}`, { method: 'DELETE' });
    if (r.status === 204) {
      log('flowLog', `✅ 테스트 계정 삭제 완료 (id: ${_testAccountId})`, 'ok');
      _testAccountId = null;
    } else {
      log('flowLog', `❌ 삭제 실패: ${r.status}`, 'err');
    }
  } catch(e) {
    log('flowLog', `❌ 삭제 오류: ${e.message}`, 'err');
  }
}

/* ── ⑥ 세션 확인 ── */
function checkSession() {
  logClear('sessionLog');
  const user = localStorage.getItem('sajuon_current_user');
  const pts  = localStorage.getItem('sajuon_points');
  if (user) {
    try {
      const u = JSON.parse(user);
      log('sessionLog', `✅ 로그인 상태`, 'ok');
      log('sessionLog', `  이름: ${u.name}`, 'ok');
      log('sessionLog', `  이메일: ${u.email}`, 'ok');
      log('sessionLog', `  포인트: ${u.points}P`, 'ok');
      log('sessionLog', `  id: ${u.id}`, 'info');
    } catch {
      log('sessionLog', '❌ 세션 데이터 파싱 오류', 'err');
    }
  } else {
    log('sessionLog', '⚠️ 로그아웃 상태 (세션 없음)', 'warn');
  }
  log('sessionLog', `sajuon_points: ${pts || '없음'}`, 'info');
}

function clearSession() {
  localStorage.removeItem('sajuon_current_user');
  localStorage.removeItem('sajuon_points');
  logClear('sessionLog');
  log('sessionLog', '✅ 세션 초기화 완료', 'ok');
}
</script>
</body>
</html>
